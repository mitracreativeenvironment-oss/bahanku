name: Automated GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Pilih tingkat rilis (Semantic Versioning)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # Job 1: Dijalankan jika dipicu secara manual dari tab Actions di GitHub
  dispatch-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version and Create Tag
        run: |
          python scripts/release.py ${{ github.event.inputs.bump }} --ci

      - name: Push Commit and Tag
        run: |
          git push origin main
          git push origin --tags

  # Job 2: Otomatis membuat GitHub Release resmi saat tag v* terdeteksi
  create-github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Notes from README
        id: notes
        run: |
          # Ekstrak versi dari tag (misal: v1.0.1)
          TAG_NAME="${{ github.ref_name }}"
          echo "TAG=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.notes.outputs.TAG }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
